<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Validation Unit Tests — PPSPJM Portal</title>
  <style>
    body { font-family: monospace; padding: 20px; background: #f9f9f9; }
    .pass { color: green; } .fail { color: red; font-weight: bold; }
    h1 { font-size: 1.2em; } pre { background: #fff; padding: 10px; border: 1px solid #ddd; }
  </style>
</head>
<body>
  <h1>Validation Unit Tests</h1>
  <pre id="output"></pre>

  <script>
    // ── Functions under test (copied from script.js) ──────────────────────
    function validatePPDB({ name, phone, address }) {
      if (!name || name.length < 3 || name.length > 100) return 'Nama harus 3–100 karakter';
      if (!phone || !/^(\+628|08)\d{8,12}$/.test(phone)) return 'Format nomor WA tidak valid (contoh: 08123456789 atau +6281234567890)';
      if (!address || address.length < 10 || address.length > 500) return 'Alamat harus 10–500 karakter';
      return null;
    }

    function validateGuestbook({ name, message }) {
      if (!name || name.length < 2 || name.length > 100) return 'Nama harus 2–100 karakter';
      if (!message || message.length < 5 || message.length > 1000) return 'Pesan harus 5–1000 karakter';
      return null;
    }

    // ── Test harness ──────────────────────────────────────────────────────
    let passed = 0, failed = 0;
    const lines = [];

    function assert(description, condition) {
      if (condition) {
        passed++;
        lines.push(`✅ PASS: ${description}`);
      } else {
        failed++;
        lines.push(`❌ FAIL: ${description}`);
      }
    }

    function runTests() {
      // ── validatePPDB tests ────────────────────────────────────────────
      assert('validatePPDB — valid inputs returns null',
        validatePPDB({ name: 'Ahmad Zaini', phone: '081234567890', address: 'Jl. Pesantren No. 1, Lasem' }) === null);

      assert('validatePPDB — name too short (< 3 chars) returns error',
        typeof validatePPDB({ name: 'AB', phone: '081234567890', address: 'Jl. Pesantren No. 1, Lasem' }) === 'string');

      assert('validatePPDB — name too long (> 100 chars) returns error',
        typeof validatePPDB({ name: 'A'.repeat(101), phone: '081234567890', address: 'Jl. Pesantren No. 1, Lasem' }) === 'string');

      assert('validatePPDB — valid +628 phone format returns null',
        validatePPDB({ name: 'Ahmad Zaini', phone: '+6281234567890', address: 'Jl. Pesantren No. 1, Lasem' }) === null);

      assert('validatePPDB — invalid phone (no leading 08 or +628) returns error',
        typeof validatePPDB({ name: 'Ahmad Zaini', phone: '081234', address: 'Jl. Pesantren No. 1, Lasem' }) === 'string');

      assert('validatePPDB — invalid phone (starts with 09) returns error',
        typeof validatePPDB({ name: 'Ahmad Zaini', phone: '09123456789', address: 'Jl. Pesantren No. 1, Lasem' }) === 'string');

      assert('validatePPDB — invalid phone (too short digits) returns error',
        typeof validatePPDB({ name: 'Ahmad Zaini', phone: '0812345', address: 'Jl. Pesantren No. 1, Lasem' }) === 'string');

      assert('validatePPDB — address too short (< 10 chars) returns error',
        typeof validatePPDB({ name: 'Ahmad Zaini', phone: '081234567890', address: 'Jl. X' }) === 'string');

      assert('validatePPDB — address too long (> 500 chars) returns error',
        typeof validatePPDB({ name: 'Ahmad Zaini', phone: '081234567890', address: 'A'.repeat(501) }) === 'string');

      assert('validatePPDB — missing name returns error',
        typeof validatePPDB({ name: '', phone: '081234567890', address: 'Jl. Pesantren No. 1, Lasem' }) === 'string');

      // ── validateGuestbook tests ───────────────────────────────────────
      assert('validateGuestbook — valid inputs returns null',
        validateGuestbook({ name: 'Budi Santoso', message: 'Pondok yang sangat bagus dan bermanfaat!' }) === null);

      assert('validateGuestbook — name too short (< 2 chars) returns error',
        typeof validateGuestbook({ name: 'A', message: 'Pesan yang cukup panjang di sini' }) === 'string');

      assert('validateGuestbook — name too long (> 100 chars) returns error',
        typeof validateGuestbook({ name: 'A'.repeat(101), message: 'Pesan yang cukup panjang di sini' }) === 'string');

      assert('validateGuestbook — message too short (< 5 chars) returns error',
        typeof validateGuestbook({ name: 'Budi', message: 'Hi' }) === 'string');

      assert('validateGuestbook — message too long (> 1000 chars) returns error',
        typeof validateGuestbook({ name: 'Budi', message: 'A'.repeat(1001) }) === 'string');

      assert('validateGuestbook — empty message returns error',
        typeof validateGuestbook({ name: 'Budi', message: '' }) === 'string');

      assert('validateGuestbook — missing name returns error',
        typeof validateGuestbook({ name: '', message: 'Pesan yang cukup panjang di sini' }) === 'string');

      // ── Summary ──────────────────────────────────────────────────────
      lines.push('');
      lines.push(`Total: ${passed + failed} | Passed: ${passed} | Failed: ${failed}`);
      document.getElementById('output').innerHTML = lines
        .map(l => `<span class="${l.startsWith('✅') ? 'pass' : l.startsWith('❌') ? 'fail' : ''}">${l}</span>`)
        .join('\n');
    }

    runTests();
  </script>
</body>
</html>
