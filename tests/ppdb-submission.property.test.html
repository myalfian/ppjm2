<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Property Test: PPDB Submission Gate (Property 5)</title>
  <style>
    body { font-family: monospace; padding: 20px; background: #f9f9f9; }
    .pass { color: green; } .fail { color: red; font-weight: bold; }
    h1 { font-size: 1.2em; } pre { background: #fff; padding: 10px; border: 1px solid #ddd; }
  </style>
</head>
<body>
  <h1>Property Test: PPDB Submission Gate</h1>
  <p style="font-size:0.85em;color:#666">
    Property 5: For any input where validatePPDB returns an error,
    <code>supabase.from</code> must never be called.
  </p>
  <pre id="output"></pre>

  <script>
    // ── Functions under test ────────────────────────────────────────────
    function validatePPDB({ name, phone, address }) {
      if (!name || name.length < 3 || name.length > 100) return 'Nama harus 3–100 karakter';
      if (!phone || !/^(\+628|08)\d{8,12}$/.test(phone)) return 'Format nomor WA tidak valid (contoh: 08123456789 atau +6281234567890)';
      if (!address || address.length < 10 || address.length > 500) return 'Alamat harus 10–500 karakter';
      return null;
    }

    // ── Minimal DOM stubs needed by submitPPDB ──────────────────────────
    function makeFormDOM(name, phone, address) {
      // Minimal stub so getElementById works in test context
      const fields = { ppdbName: name, ppdbPhone: phone, ppdbAddress: address,
                       ppdbGender: 'Laki-laki', ppdbProgram: 'SMP Plus & Pesantren',
                       'ppdbForm-error': null };
      const origGetEl = document.getElementById.bind(document);
      document.getElementById = (id) => {
        if (id in fields) return { value: fields[id], reset: () => {} };
        return origGetEl(id);
      };
      return () => { document.getElementById = origGetEl; };
    }

    function showFormError(formId, message) { /* stub — no-op in tests */ }
    function clearFormError(formId) { /* stub — no-op in tests */ }
    function closeModal(id) { /* stub */ }

    // ── submitPPDB (inlined from script.js for test isolation) ──────────
    async function submitPPDB(e) {
      if (e && e.preventDefault) e.preventDefault();
      clearFormError('ppdbForm');

      const name    = (document.getElementById('ppdbName')?.value || '').trim();
      const gender  = document.getElementById('ppdbGender')?.value || '';
      const program = document.getElementById('ppdbProgram')?.value || '';
      const phone   = (document.getElementById('ppdbPhone')?.value || '').trim();
      const address = (document.getElementById('ppdbAddress')?.value || '').trim();

      const validationError = validatePPDB({ name, phone, address });
      if (validationError) {
        showFormError('ppdbForm', validationError);
        return;
      }

      if (!supabase) {
        showFormError('ppdbForm', 'Layanan pendaftaran tidak tersedia.');
        return;
      }

      const { error } = await supabase.from('ppdb_submissions').insert({ name, gender, program, phone, address });
      if (error) { showFormError('ppdbForm', 'Pendaftaran gagal.'); return; }
      closeModal('ppdbModal');
    }

    // ── Test harness ────────────────────────────────────────────────────
    let passed = 0, failed = 0;
    const lines = [];

    function assert(description, condition) {
      if (condition) { passed++; lines.push(`✅ PASS: ${description}`); }
      else           { failed++; lines.push(`❌ FAIL: ${description}`); }
    }

    // ── Property test inputs: every combination that FAILS validation ───
    const invalidInputs = [
      { name: 'AB', phone: '081234567890', address: 'Jl. Pesantren No. 1, Lasem', label: 'name too short' },
      { name: 'A'.repeat(101), phone: '081234567890', address: 'Jl. Pesantren No. 1, Lasem', label: 'name too long' },
      { name: 'Ahmad', phone: '0812', address: 'Jl. Pesantren No. 1, Lasem', label: 'phone too short' },
      { name: 'Ahmad', phone: '09123456789', address: 'Jl. Pesantren No. 1, Lasem', label: 'phone wrong prefix' },
      { name: 'Ahmad', phone: 'abcdefghij', address: 'Jl. Pesantren No. 1, Lasem', label: 'phone non-numeric' },
      { name: 'Ahmad', phone: '081234567890', address: 'Short', label: 'address too short' },
      { name: 'Ahmad', phone: '081234567890', address: 'A'.repeat(501), label: 'address too long' },
      { name: '', phone: '081234567890', address: 'Jl. Pesantren No. 1, Lasem', label: 'empty name' },
    ];

    async function runPropertyTests() {
      lines.push('--- Testing: invalid inputs should NEVER call supabase.from ---');
      lines.push('');

      for (const input of invalidInputs) {
        let fromCalled = false;

        // Create a mock supabase that tracks calls
        window.supabase = {
          from: () => {
            fromCalled = true;
            return { insert: async () => ({ error: null }) };
          }
        };

        const restore = makeFormDOM(input.name, input.phone, input.address);

        // Confirm validatePPDB actually returns an error for this input
        const validationResult = validatePPDB({ name: input.name, phone: input.phone, address: input.address });
        assert(`validatePPDB returns error for [${input.label}]`, validationResult !== null);

        // Now run submitPPDB — it must NOT call supabase.from
        await submitPPDB({ preventDefault: () => {} });

        assert(`supabase.from NOT called when input is invalid [${input.label}]`, !fromCalled);

        restore();
      }

      lines.push('');
      lines.push('--- Testing: valid input DOES call supabase.from ---');
      lines.push('');

      let fromCalledForValid = false;
      window.supabase = {
        from: () => {
          fromCalledForValid = true;
          return { insert: async () => ({ error: null }) };
        }
      };

      const restore = makeFormDOM('Ahmad Zaini', '081234567890', 'Jl. Pesantren No. 1, Lasem');
      await submitPPDB({ preventDefault: () => {} });
      restore();

      assert('supabase.from IS called when input is valid', fromCalledForValid);

      lines.push('');
      lines.push(`Total: ${passed + failed} | Passed: ${passed} | Failed: ${failed}`);

      document.getElementById('output').innerHTML = lines
        .map(l => `<span class="${l.startsWith('✅') ? 'pass' : l.startsWith('❌') ? 'fail' : ''}">${l}</span>`)
        .join('\n');
    }

    runPropertyTests();
  </script>
</body>
</html>
