name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    name: Lint & Validation Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install --prefer-offline --no-audit

      - name: Check JavaScript Syntax & Linting
        run: npm run lint

      - name: Run Build Verification
        run: npm run build

      - name: Run CI Validation Tests
        run: npm test

      - name: Run Local Production Smoke Test
        run: npm run smoke

